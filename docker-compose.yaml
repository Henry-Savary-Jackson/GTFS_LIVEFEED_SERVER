services:


  flask: 
    build: .
    ports:
      - 5000:5000
      - 5556:5555
    volumes:
      - ./server_files/static/shared:/flask-app/server_files/static/shared
      - ./server_files/shared_private:/flask-app/server_files/shared_private
    environment:
      REDIS_HOST: redis_db
      REDIS_PORT: 6379 
      C_FORCE_ROOT: "true"
    # networks:
      # - regions_net

  redis_db:
    image:
      "redis"
    ports:
      - 6379:6379
    # networks:
      # - regions_net
  
  reverse-proxy:
    image: "jwilder/nginx-proxy:latest"
    container_name: "reverse-proxy"
    volumes:
        - "./nginx_conf/certs:/etc/nginx/certs:ro"
        - "./nginx_conf/nginx.conf:/etc/nginx/nginx.conf:ro"
        - "./server_files/shared_private/:/var/log/nginx/"
        - "/run/docker.sock:/tmp/docker.sock:ro"
    restart: "always"
    ports:
        - "80:80"
        - "443:443"
        - 5555:5556
    # networks:
          # - regions_net
