services:


  wc: 
    build:
      context: .
    image: hsj/gtfsserver:latest
    ports:
      - 5000:5000
    volumes:
      - ./server_files/global:/flask-app/server_files/global
      - ./server_files/shared_private/wc:/flask-app/server_files/shared_private
    environment:
      REDIS_HOST: redis_db
      REDIS_PORT: 6379 
      REGION: wc
      REDIS_DB: 0
    env_file:
      - wc.env

  durb: 
    image: hsj/gtfsserver:latest
    ports:
      - 5002:5000
    volumes:
      - ./server_files/global:/flask-app/server_files/global
      - ./server_files/shared_private/durb:/flask-app/server_files/shared_private
    environment:
      REDIS_HOST: redis_db
      REDIS_PORT: 6379 
      REDIS_DB: 1
      REGION: durb
    env_file:
      - durb.env

  gaut:
    image: hsj/gtfsserver:latest
    env_file:
      - gaut.env
    ports:
      - 5001:5000
    volumes:
      - ./server_files/global:/flask-app/server_files/global
      - ./server_files/shared_private/gaut:/flask-app/server_files/shared_private
    environment:
      REDIS_HOST: redis_db
      REDIS_PORT: 6379 
      REGION: gaut 
      REDIS_DB: 2
      
  ec:
    image: hsj/gtfsserver:latest
    env_file:
      - ec.env
    ports:
      - 5003:5000
    volumes:
      - ./server_files/global:/flask-app/server_files/global
      - ./server_files/shared_private/ec:/flask-app/server_files/shared_private
    environment:
      REDIS_HOST: redis_db
      REDIS_PORT: 6379 
      REGION: ec 
      REDIS_DB: 3

  redis_db:
    image:
      "redis"
    ports:
      - 6379:6379
  
  reverse-proxy:
    image: "jwilder/nginx-proxy:latest"
    container_name: "reverse-proxy"
    volumes:
        - "./nginx_conf/certs:/etc/nginx/certs:ro"
        - "./server_files/static:/var/www/html:rw"
        - "./nginx_conf/nginx.conf:/etc/nginx/nginx.conf:ro"
        - "./server_files/shared_private/:/var/log/nginx/"
        - "/run/docker.sock:/tmp/docker.sock:ro"
    restart: "always"
    ports:
        - "80:80"
        - "443:443"